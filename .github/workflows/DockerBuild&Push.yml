name: Docker Build & Push

on:
  push:
    branches:
      - dev
    paths:
      - 'services/**'

  workflow_dispatch:
    inputs:
      image_choice:
        description: 'Choose which Docker image to build and push'
        required: true
        type: choice
        options:
          - all
          - api-gateway
          - dashboard-api
          - inventory-service
          - notification-service
          - order-service
          - payment-service
          - scheduler
          - shipping-service
          - worker
      environment:
        description: 'Choose which environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - prod

jobs:
    docker-build-manual:
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.image_choice != 'all' }}
        runs-on: ubuntu-24.04
        defaults:
            run:
                working-directory: "./services/${{ inputs.image_choice }}"
        permissions:
            security-events: write # for github/codeql-action/upload-sarif to upload SARIF results
            id-token: write   # This is required for requesting the JWT

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Login to AWS
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
                role-session-name: github-actions-docker-session
                aws-region: eu-west-2

            - name: Login to AWS ECR
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build
              run: |
                docker build -t ${{ inputs.image_choice }} .

            - name: Tagging image to ECR repository
              run: |
                docker tag ${{ inputs.image_choice }} ${{ secrets.ECR_REPOSITORY }}/${{ inputs.environment }}-${{ inputs.image_choice }}:${{ github.sha }}
                docker tag ${{ inputs.image_choice }} ${{ secrets.ECR_REPOSITORY }}/${{ inputs.environment }}-${{ inputs.image_choice }}:latest

            - name: Trivy Scan
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: ${{ inputs.image_choice }}
                severity: 'CRITICAL,HIGH'
                format: 'sarif'
                output: 'trivy-results-${{ inputs.image_choice }}-Docker.sarif'
                exit-code: 0
      
            - name: Upload Trivy scan results to GitHub Security tab
              uses: github/codeql-action/upload-sarif@v3
              with:
                sarif_file: 'trivy-results-${{ inputs.image_choice }}-Docker.sarif'
                wait-for-processing: true

            - name: Pushing docker image
              run: docker push ${{ secrets.ECR_REPOSITORY }}/${{ inputs.environment }}-${{ inputs.image_choice }} --all-tags

    docker-build-manual-all:
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.image_choice == 'all' }}
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                service:
                  - api-gateway
                  - dashboard-api
                  - inventory-service
                  - notification-service
                  - order-service
                  - payment-service
                  - scheduler
                  - shipping-service
                  - worker
        defaults:
            run:
                working-directory: "./services/${{ matrix.service }}"
        permissions:
            security-events: write
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Login to AWS
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
                role-session-name: github-actions-docker-session
                aws-region: eu-west-2

            - name: Login to AWS ECR
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build
              run: |
                docker build -t ${{ matrix.service }} .

            - name: Tagging image to ECR repository
              run: |
                docker tag ${{ matrix.service }} ${{ secrets.ECR_REPOSITORY }}/${{ inputs.environment }}-${{ matrix.service }}:${{ github.sha }}
                docker tag ${{ matrix.service }} ${{ secrets.ECR_REPOSITORY }}/${{ inputs.environment }}-${{ matrix.service }}:latest

            - name: Trivy Scan
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: ${{ matrix.service }}
                severity: 'CRITICAL,HIGH'
                format: 'sarif'
                output: 'trivy-results-${{ matrix.service }}-Docker.sarif'
                exit-code: 0

            - name: Upload Trivy scan results to GitHub Security tab
              uses: github/codeql-action/upload-sarif@v3
              with:
                sarif_file: 'trivy-results-${{ matrix.service }}-Docker.sarif'
                wait-for-processing: true

            - name: Pushing docker image
              run: docker push ${{ secrets.ECR_REPOSITORY }}/${{ inputs.environment }}-${{ matrix.service }} --all-tags

    detect-dev-service-changes:
        if: ${{ github.event_name == 'push' }}
        runs-on: ubuntu-24.04
        outputs:
            services: ${{ steps.filter.outputs.changes }}

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Detect changed services
              id: filter
              uses: dorny/paths-filter@v4
              with:
                filters: |
                  api-gateway:
                    - 'services/api-gateway/**'
                  dashboard-api:
                    - 'services/dashboard-api/**'
                  inventory-service:
                    - 'services/inventory-service/**'
                  notification-service:
                    - 'services/notification-service/**'
                  order-service:
                    - 'services/order-service/**'
                  payment-service:
                    - 'services/payment-service/**'
                  scheduler:
                    - 'services/scheduler/**'
                  shipping-service:
                    - 'services/shipping-service/**'
                  worker:
                    - 'services/worker/**'


    auto-docker-build-dev:
        if: ${{ github.event_name == 'push' && needs.detect-dev-service-changes.outputs.services != '[]' }}
        needs: detect-dev-service-changes
        runs-on: ubuntu-24.04
        strategy:
            fail-fast: false
            matrix:
                service: ${{ fromJson(needs.detect-dev-service-changes.outputs.services) }}
        defaults:
            run:
                working-directory: "./services/${{ matrix.service }}"
        permissions:
            security-events: write
            id-token: write

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Login to AWS
              uses: aws-actions/configure-aws-credentials@v4
              with:
                role-to-assume: ${{ secrets.AWS_GITHUB_ROLE_ARN }}
                role-session-name: github-actions-docker-session
                aws-region: eu-west-2

            - name: Login to AWS ECR
              uses: aws-actions/amazon-ecr-login@v2

            - name: Build
              run: |
                docker build -t ${{ matrix.service }} .

            - name: Tagging image to dev ECR repository
              run: |
                docker tag ${{ matrix.service }} ${{ secrets.ECR_REPOSITORY }}/dev-${{ matrix.service }}:${{ github.sha }}
                docker tag ${{ matrix.service }} ${{ secrets.ECR_REPOSITORY }}/dev-${{ matrix.service }}:latest

            - name: Trivy Scan
              uses: aquasecurity/trivy-action@v0.36.0
              with:
                image-ref: ${{ matrix.service }}
                severity: 'CRITICAL,HIGH'
                format: 'sarif'
                output: 'trivy-results-${{ matrix.service }}-Docker.sarif'
                exit-code: 0

            - name: Upload Trivy scan results to GitHub Security tab
              uses: github/codeql-action/upload-sarif@v3
              with:
                sarif_file: 'trivy-results-${{ matrix.service }}-Docker.sarif'
                wait-for-processing: true

            - name: Pushing docker image
              run: docker push ${{ secrets.ECR_REPOSITORY }}/dev-${{ matrix.service }} --all-tags
